# Publish tgden's remote MCP server to the official MCP Registry
# (registry.modelcontextprotocol.io) — the index that feeds MCP clients and the
# downstream directories (Glama, Smithery, PulseMCP, mcp.so).
#
# The registry's own search matches the server NAME only: on 2026-08-08, 88
# servers answered a search for "telegram" and ours was not one of them, because
# it was named `.../tgden`. Description and title are for humans reading the
# listing; the name is the only thing discovery keys on. Hence `telegram-catalog`.
#
# Nothing is built here — the server is remote (streamable HTTP), so the registry
# only needs metadata plus proof we own the io.github.JustJuice55 namespace,
# which GitHub OIDC provides with no stored secret.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      deprecate_name:
        description: "Optional: server name to mark deprecated after publishing (e.g. a renamed old entry)"
        required: false
        default: ""
      deprecate_version:
        description: "Version of the server to deprecate"
        required: false
        default: ""
      deprecate_message:
        description: "Message shown with the deprecation"
        required: false
        default: ""
      deprecate_status:
        description: "deprecated (visible with a warning) or deleted (hidden, frees the remote URL)"
        required: false
        default: "deprecated"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token = namespace ownership proof
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate

      # Runs BEFORE publish on purpose: the registry allows one remote URL per
      # server name, so a renamed entry cannot be published until the old one
      # releases the URL. `deleted` only hides it from listings and is reversible.
      - name: Retire the old entry (optional)
        if: inputs.deprecate_name != ''
        run: |
          ./mcp-publisher status --status "${{ inputs.deprecate_status }}" \
            --message "${{ inputs.deprecate_message }}" \
            "${{ inputs.deprecate_name }}" "${{ inputs.deprecate_version }}"

      - name: Publish server
        run: ./mcp-publisher publish
