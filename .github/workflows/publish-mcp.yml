# Publish tgden's remote MCP server to the official MCP Registry
# (registry.modelcontextprotocol.io) — the index that feeds MCP clients and the
# downstream directories (Glama, Smithery, PulseMCP, mcp.so).
#
# server.json had been sitting in this repo unpublished: the registry listed 20
# Telegram MCP servers on 2026-08-08 and none of them was ours. Nothing to build
# here — the server is remote (streamable HTTP), so the registry only needs the
# metadata plus proof we own the io.github.JustJuice55 namespace, which GitHub
# OIDC provides without any stored secret.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token = namespace ownership proof
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server
        run: ./mcp-publisher publish
